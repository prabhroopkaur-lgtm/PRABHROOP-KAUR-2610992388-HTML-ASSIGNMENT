<DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width="device-width, initial-scale=1.0>
        <title>COLLEGE ADMISSION FORM</title>
    </head>
    <body>
        <h1>COLLEGE ADMISSION FORM</h1>
        <form action="resultofform.html" method="GET">
            <label>FULL NAME : </label>
            <input type="text" name="fullname" placeholder="ENTER YOUR FULL NAME" required>
            <br>
            <br>
            <label>EMAIL ADDRESS : </label>
            <input type="email" name="email" placeholder="ENTER YOUR EMAIL" required>
            <br>
            <br>
            <label>CREATE PASSWORD : </label>
            <input type="password" name="password" placeholder="ENTER THE PASSWORD" required>
            <br>
            <br>
            <label>MOBILE NUMBER : </label>
            <input type="tel" name="telno" placeholder="ENTER YOUR NUMBER">
            <br>
            <br>
            <label>DATE OF BIRTH : </label>
            <input type="date" name="dob" placeholder="ENTER YOUR BIRTHDATE">
            <br>
            <br>
            <label>GENDER : </label>
            <input type="radio" name="gender" value="female">
            <label>FEMALE</label>
            <input type="radio" name="gender" value="male">
            <label>MALE</label>
            <input type="radio" name="gender" value="other">
            <label>OTHER</label>
            <br>
            <br>
            <label>SELECT COURSE : </label>
            <select name="course">
                <option value="courseselection">--SELECT COURSE--</option>
                <option value="cse">CSE</option>
                <option value="aiml">AI-ML</option>

            </select>
            <br>
            <br>
            <label>SELECT CITY : </label>
            <select name="city">
                <option value="citysel">--SELECT CITY--</option>
                <option value="sirsa">SIRSA</option>
                <option value="rajpura">RAJPURA</option>
            </select>
            <br>
            <br>
            <label>ADDRESS : </label>
            <br>
            <textarea name="address" rows="5" cols="30"></textarea>
            <br>
            <br> 
            <input type="submit" value="REGISTER">
            <input type="reset" value="CLEAR FORM">
          </form>

    
    </body>
</html>

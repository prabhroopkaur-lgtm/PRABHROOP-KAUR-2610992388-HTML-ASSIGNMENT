<!DOCTYPE html> 
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>....</title>
        <style>
           .banner{
            background-image:linear-gradient(to right,rgba(65, 162, 65, 0.439),rgba(92, 221, 221, 0.329),rgba(58, 184, 248, 0.644),rgba(0, 0, 255, 0.428),rgba(154, 28, 227, 0.424));
            background-size:cover;
            background-position:center;
            height:150vh;
            display:flex;
            flex-direction:column;
            justify-content:flex-start;
            align-items:flex-start;
            color:rgb(7, 7, 48);
            padding:90px;
           }
           .banner p{
            font-size:30px;
            margin-top:-15px;
            max-width:870px;
            font-weight:60;
            font-family:Helvetica, sans-serif;
            
           }
           button{
            padding:10px 10px;
            font-size:17px;
            background-color:rgba(68, 220, 243, 0.426);
            color:#cf2784;
            border:none;
            border-radius:8px;
            cursor:pointer;
           }
           button:hover{
            background-color:rgba(87, 37, 61, 0.819);
           }
        </style>
    </head>
    <body>
    <div class="banner">
        <p style="font-size:20px;margin-bottom:-10px;color:rgba(11, 68, 16, 0.574);">EXPLORE THE WORLD</p>
        <h1>Your Next Adventure Awaits!</h1>
        <p>Discover breathtaking destinations, embark on thrilling adventures, and create unforgettable memories. Start your journey today!</p>
        <button>Explore Places</button>
    </div>
    </body>
</html>

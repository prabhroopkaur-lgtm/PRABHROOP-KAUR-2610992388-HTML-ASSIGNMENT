<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>....</title>
        <style>
            .banner{
                background-image: url("983ac8858cdbd737d262ee21b6f21ba6 (1).jpg");
                background-size: cover;
                background-position: center;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: rgba(244, 245, 251, 0.801);
            }
            .banner button{
                padding: 10px 10px;
                font-size: 17px;
                background-color: rgba(128, 128, 128, 0.426);
                color: #fff;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }
            .banner button:hover{
                background-color: rgba(215, 21, 21, 0.233);
            }
            .banner p{
                font-size: 30px;
                margin-bottom: 20px;
                font-weight: 60;
                font-family:Helvetica, sans-serif;
            }
            .banner h1{
                font-size: 45px;
                margin-bottom: 20px;
                font-weight: 60;
                font-family:Helvetica, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="banner">
            <h1>Welcome!!</h1>
            <p>Take a look at this super slider.</p>
            <button>Go to post</button>
        </div>
